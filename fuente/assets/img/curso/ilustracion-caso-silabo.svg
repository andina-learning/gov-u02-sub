<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img"
     aria-label="Un docente muestra abierto el sílabo de su asignatura. En la primera página, un estudiante examina con una lupa un documento institucional y, con un lápiz, escribe una propuesta para la institución, con una flecha que sube. En la segunda, una franja dividida en tres partes: 60 % para un examen escrito de cuatro bloques, 20 % para un libro con un calendario semanal y 20 % para los mensajes de un foro con marcas de conteo.">
  <!-- Ilustración de marca · Universidad Andina Virtual · gov-u02-sub · tema 3 (cuerpo · 3.1)
       Concepto (DI, P666): «Sus resultados de aprendizaje declaran que el estudiante evalúa políticas institucionales
       y formula propuestas de mejora fundamentadas. […] Sin embargo, el sistema de evaluación asigna el 60 % a un examen escrito…»
       Franja: 432 / 144 / 144 = 60 / 20 / 20. Único amarillo: el examen. Cifras trazadas (Manrope SemiBold). -->
