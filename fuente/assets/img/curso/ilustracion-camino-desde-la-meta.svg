<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="Una montaña con una bandera amarilla en la cima. Un lápiz grande dibuja el camino desde la bandera hacia abajo: el tramo de arriba ya está trazado con línea continua; el que falta, punteado, llega hasta una persona con mochila que espera al pie de la montaña.">
  <!-- Ilustración de marca · Universidad Andina Virtual · gov-u02-sub · introducción (ambientación)
       Concepto (DI, P27): «invirtiendo la lógica tradicional: se parte de los resultados esperados para
       definir las evidencias y, finalmente, las experiencias de aprendizaje».
       Único amarillo: la bandera (los resultados esperados, de donde se parte). Sin texto. -->
  <defs>
    <linearGradient id="ilu-retro-intro-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6F3FA"/>
      <stop offset="55%" stop-color="#E8EDF5"/>
      <stop offset="100%" stop-color="#F5F8FB"/>
    </linearGradient>
    <clipPath id="ilu-retro-intro-corte"><rect width="1200" height="400" rx="18"/></clipPath>
    <filter id="ilu-retro-intro-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#132B41" flood-opacity="0.24"/>
    </filter>
    <filter id="ilu-retro-intro-sombra-monte" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-4" stdDeviation="14" flood-color="#132B41" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g clip-path="url(#ilu-retro-intro-corte)">
    <rect width="1200" height="400" fill="url(#ilu-retro-intro-fondo)"/>
    <circle cx="900" cy="120" r="150" fill="#FFFFFF" opacity=".6"/>
    <path transform="translate(1100 44) scale(.3)" fill="#ED6A48" d="M50 0C53 36 64 47 100 50C64 53 53 64 50 100C47 64 36 53 0 50C36 47 47 36 50 0Z"/>
    <!-- Cerros del fondo -->
    <path d="M0 400V292C90 262 150 222 220 222C300 222 350 290 460 300C560 308 620 220 690 214L1200 250V400Z" fill="#84C9BF" opacity=".38"/>
    <!-- La montaña -->
    <path d="M0 400V352C190 352 340 338 440 306C560 266 640 258 720 198C790 144 840 112 890 112C940 112 1000 172 1070 224C1120 260 1170 276 1200 280V400Z" fill="#B5E3EF" filter="url(#ilu-retro-intro-sombra-monte)"/>
    <!-- Lo que falta trazar -->
    <path d="M540 322C460 298 400 384 226 372" fill="none" stroke="#00417B" stroke-opacity=".7" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 19"/>
    <!-- El camino ya trazado, desde la bandera -->
    <path d="M890 118C896 164 1022 190 994 234C964 276 830 208 776 252C728 292 752 352 650 350C604 348 570 336 540 322" fill="none" stroke="#00417B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- La bandera: los resultados esperados (único amarillo) -->
    <line x1="890" y1="122" x2="890" y2="22" stroke="#132B41" stroke-width="8" stroke-linecap="round"/>
    <path d="M894 24C926 10 952 40 996 26L982 56L996 88C952 102 926 72 894 86Z" fill="#F0B443"/>
    <!-- El lápiz -->
    <g transform="translate(540 322) rotate(-24)" filter="url(#ilu-retro-intro-sombra)">
      <path d="M0 0L-23 -62H23Z" fill="#F6E7D8"/>
      <path d="M0 0L-9 -24H9Z" fill="#00417B"/>
      <path d="M-23 -62Q-15 -74 -8 -62Q0 -74 8 -62Q15 -74 23 -62V-240H-23Z" fill="#3A93D0"/>
      <path d="M-8 -66V-240H8V-66Q0 -74 -8 -66Z" fill="#84BCE4"/>
      <rect x="-23" y="-256" width="46" height="18" fill="#C2C4C4"/>
      <path d="M-23 -256V-270Q-23 -286 -7 -286H7Q23 -286 23 -270V-256Z" fill="#1C4578"/>
    </g>
    <!-- La persona que recorrerá el camino -->
    <ellipse cx="172" cy="374" rx="58" ry="7" fill="#132B41" opacity=".12"/>
    <rect x="124" y="252" width="38" height="66" rx="14" fill="#3A93D0"/>
    <g fill="none" stroke="#132B41" stroke-width="18" stroke-linecap="round">
      <path d="M166 314L156 366"/><path d="M182 314L190 366"/>
    </g>
    <path d="M150 268Q150 244 174 244Q198 244 198 268V322H150Z" fill="#00417B"/>
    <path d="M184 264L206 292L224 272" fill="none" stroke="#00417B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="177" cy="212" r="24" fill="#FFFFFF" stroke="#00417B" stroke-width="6"/>
    <path d="M154 211A24 24 0 0 1 196 196Q180 206 154 211Z" fill="#00417B"/>
  </g>
</svg>
